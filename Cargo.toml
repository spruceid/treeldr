[package]
name = "treeldr"
description = "TreeLDR Layouts"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["serde_json", "serde_cbor"]

# JSON extension.
json = []

# Implements conversion functions between `Value` and `json_syntax::Value`.
json-syntax = ["json", "dep:json-syntax"]

# Implements conversion functions between `Value` and `serde_json::Value`.
serde_json = ["json", "dep:serde_json"]

# CBOR extension.
cbor = []

# Implements conversion functions between `Value` and `serde_cbor::Value`.
serde_cbor = ["cbor", "dep:serde_cbor"]

[workspace]
members = [
	"cli"
	# "layouts",
	# "generators/rust/treeldr-rs",
	# "generators/rust/treeldr-rs-macros",
	# "generators/rust/generator"
]
resolver = "2"

[workspace.package]
authors = ["Spruce Systems Inc."]
edition = "2021"
rust-version = "1.80.0"
version = "0.2.0"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
treeldr = { path = "." }

log = "0.4"
educe = "0.4.23"
thiserror = "1.0.64"
json-syntax = "0.12.5"
nquads-syntax = "0.19.0"
serde = "1.0.210"
serde_json = "1.0.128"
serde_cbor = "0.11.2"
locspan = "0.8.2"

[dependencies]
educe.workspace = true
iref = { version = "3.2.2", features = ["macros", "serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
rdf-types = { version = "0.22.4", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-seeded = { path = "/home/timothee/Projets/utils/serde-seeded" }
xsd-types = "0.9.6"
thiserror.workspace = true
locspan.workspace = true
raw-btree = "0.3.0"
dashmap = "6.1.0"

json-syntax = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }

ll1 = { git = "https://github.com/timothee-haudebourg/ll1-rs.git", rev = "aeb9c32" }
iregex = { version = "0.1.3", features = ["serde"] }
iregex-syntax = "0.1"
disjoint-collections = "0.1"
scc-trait = "1.0"
langtag = "0.4.0"

[dev-dependencies]
nquads-syntax.workspace = true
# serde_json.workspace = true
paste = "1.0"
